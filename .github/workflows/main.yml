name: Build Minecraft Mod

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Validate Gradle wrapper
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 3️⃣ Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4️⃣ Make gradlew executable
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 5️⃣ Clean, refresh dependencies, and build the mod
      - name: Build mod
        run: |
          ./gradlew --stop
          ./gradlew clean
          ./gradlew --refresh-dependencies
          ./gradlew build

      # 6️⃣ Upload the built .jar as an artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tier_tagger
          path: build/libs/*.jar

